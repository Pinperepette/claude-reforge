<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Accent bar left -->
  <rect x="0" y="0" width="5" height="200" fill="url(#accent)" rx="2"/>

  <!-- Top accent line -->
  <rect x="40" y="40" width="200" height="2" fill="url(#accent)" rx="1" opacity="0.6"/>

  <!-- Title -->
  <text x="40" y="95" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#f0f6fc" letter-spacing="-1">Claude Reforge</text>

  <!-- Subtitle -->
  <text x="40" y="130" font-family="'Courier New', monospace" font-size="16" fill="#8b949e">Persistent memory and learning for Claude Code</text>

  <!-- Tag line -->
  <text x="40" y="162" font-family="'Courier New', monospace" font-size="13" fill="#7c3aed" opacity="0.9">What didn't work last time won't waste your time this time.</text>

  <!-- Right side decoration -->
  <text x="760" y="85" font-family="'Courier New', monospace" font-size="11" fill="#30363d" text-anchor="middle">episodic</text>
  <text x="760" y="105" font-family="'Courier New', monospace" font-size="11" fill="#30363d" text-anchor="middle">semantic</text>
  <text x="760" y="125" font-family="'Courier New', monospace" font-size="11" fill="#30363d" text-anchor="middle">rules</text>

  <rect x="805" y="72" width="60" height="14" fill="none" stroke="#30363d" stroke-width="1" rx="3"/>
  <rect x="805" y="92" width="60" height="14" fill="none" stroke="#30363d" stroke-width="1" rx="3"/>
  <rect x="805" y="112" width="60" height="14" fill="none" stroke="#30363d" stroke-width="1" rx="3"/>

  <rect x="805" y="72" width="60" height="14" fill="#7c3aed" rx="3" opacity="0.4"/>
  <rect x="805" y="92" width="45" height="14" fill="#2563eb" rx="3" opacity="0.3"/>
  <rect x="805" y="112" width="30" height="14" fill="#7c3aed" rx="3" opacity="0.2"/>

  <!-- Bottom line -->
  <rect x="40" y="178" width="820" height="1" fill="#21262d"/>
</svg>
